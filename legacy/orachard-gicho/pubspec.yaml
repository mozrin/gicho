name: moztopia
description: Flutter integrations and reusable UI foundations for Moztopia applications.
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  app_links: ^7.2.1
  camera: ^0.12.0+2
  crypto: ^3.0.7
  crop_your_image: ^2.0.0
  cupertino_ui: ^1.0.0
  material_ui: ^1.0.0
  dio: ^5.11.0
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  go_router: ^17.4.0
  geolocator: ^14.0.3
  image: ^4.9.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_schema: ^5.2.2
  logger: ^2.7.0
  qonversion_flutter: ^11.10.0
  reactive_forms: ^18.2.2
  shared_preferences: ^2.5.5
  toastification: ^3.2.0
  url_launcher: ^6.3.2
  yaml: ^3.1.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - lib/src/authentication/authentication.config.yaml
    - lib/src/authentication/authentication.config.schema.json
    - lib/src/entitlements/entitlements.config.yaml
    - lib/src/entitlements/entitlements.config.schema.json
    - lib/src/core/core.config.yaml
    - lib/src/core/core.config.schema.json
    - lib/src/localization/localization.config.yaml
    - lib/src/localization/localization.config.schema.json
    - lib/src/localization/localization.languages.json
    - lib/src/localization/localization.languages.schema.json
    - lib/src/logging/logging.config.yaml
    - lib/src/logging/logging.config.schema.json
    - lib/src/notifications/notifications.config.yaml
    - lib/src/notifications/notifications.config.schema.json
    - lib/src/startup/startup.config.yaml
    - lib/src/startup/startup.config.schema.json
    - lib/src/theme/theme.config.yaml
    - lib/src/theme/theme.config.schema.json
