<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Core/Cube Gradient -->
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="subShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Subtle Ambient Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="24" />

  <!-- Central Core Symbol (Nested Geometric Layers representing Flutter/Core) -->
  <g filter="url(#dropShadow)">
    <!-- Outer Hex/Diamond Core Frame -->
    <path d="M256 96 L384 170 L384 342 L256 416 L128 342 L128 170 Z"
          fill="none"
          stroke="#38BDF8"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.6" />

    <!-- Inner Solid Core Stack -->
    <path d="M256 140 L346 192 L346 320 L256 372 L166 320 L166 192 Z"
          fill="url(#coreGradient)" />

    <!-- Central Focal Node (Moztopia 'M' / Core Anchor) -->
    <path d="M256 190 L300 216 L300 296 L256 322 L212 296 L212 216 Z"
          fill="#0F172A" />

    <!-- Core Pulse Center -->
    <circle cx="256" cy="256" r="28" fill="url(#accentGradient)" filter="url(#subShadow)" />

    <!-- Dynamic Accent Nodes (Floating Modules) -->
    <circle cx="384" cy="170" r="12" fill="#FB7185" filter="url(#subShadow)" />
    <circle cx="128" cy="342" r="12" fill="#38BDF8" filter="url(#subShadow)" />
  </g>
</svg>
