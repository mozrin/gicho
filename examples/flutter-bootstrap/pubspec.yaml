name: gicho_bootstrap_example
description: A minimal Gicho startup and retry example.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  gicho:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/launch_logo.png
    - assets/gicho/gicho.yaml
    - assets/gicho/gicho.schema.json
